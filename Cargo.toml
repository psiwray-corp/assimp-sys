[package]
name = "assimp-sys"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "Raw FFI bindings for the system Assimp shared library."
authors = ["Luca Cavallari <development@psiwray.com>"]
license = "MIT AND BSD-3-Clause"
readme = "README.md"
repository = "https://github.com/psiwray-corp/assimp-sys"
keywords = ["assimp", "3d", "model", "ffi", "bindings"]
categories = ["graphics", "api-bindings", "external-ffi-bindings"]
exclude = [".cargo", ".gitattributes", ".gitignore", ".rustfmt.toml", "bindgen", "docs", "scripts"]
publish = ["forgejo"]
links = "assimp"
build = "build.rs"

[lib]
name = "assimp_sys"
path = "src/lib.rs"
